# Delivery option A for the PUBLIC SIGN-IN site: GitHub + GitHub Actions
#
# Deploys content/public-signin-static-website/ to the Static Web App behind Front Door. Every page
# except /healthz.html requires Entra ID sign-in (approved B2B guests only).
#   - Pull request to main (opened, synchronize, reopened): create or update a preview environment
#   - Pull request closed: remove its preview environment
#   - Push or approved merge to main: deploy production
#
# The Function API, documents and infrastructure are released separately, so
# api_location is deliberately empty and there is no build step.
#
# Required secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN_PUBLIC_SIGNIN  deployment token (terraform output static_web_app_deployment_token)
#   SWA_CONFIG_JSON                           sign-in config (terraform output staticwebapp_config_json)

name: Deploy public sign-in Azure Static Web App

on:
  push:
    branches: [main]
    paths: ["content/public-signin-static-website/**", ".github/workflows/deploy-public-signin-static-web-app.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: swa-public-signin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'public-signin-preview' || 'public-signin-production' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the site files are present
        run: |
          for f in content/public-signin-static-website/index.html content/public-signin-static-website/styles.css content/public-signin-static-website/main.js content/public-signin-static-website/healthz.html; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done

      - name: Write Entra sign-in config
        env:
          SWA_CONFIG_JSON: ${{ secrets.SWA_CONFIG_JSON }}
        run: |
          test -n "$SWA_CONFIG_JSON" || { echo "::error::SWA_CONFIG_JSON secret is empty"; exit 1; }
          printf '%s' "$SWA_CONFIG_JSON" > content/public-signin-static-website/staticwebapp.config.json
          python3 -m json.tool content/public-signin-static-website/staticwebapp.config.json > /dev/null

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PUBLIC_SIGNIN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: content/public-signin-static-website
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_preview:
    name: Remove preview environment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PUBLIC_SIGNIN }}
          action: close

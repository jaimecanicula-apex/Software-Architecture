# Delivery option A for the PRIVATELY accessible site with storage: GitHub + GitHub Actions
#
# Deploys content/privately-accessible-static-website-with-storage/ to the private Azure Static Web App (public network
# access off, APEX Entra sign-in). The site stays private; only the upload uses
# the Static Web Apps deployment service.
#   - Pull request to main (opened, synchronize, reopened): create or update a preview environment
#   - Pull request closed: remove its preview environment
#   - Push or approved merge to main: deploy production
#
# The Function API, documents and infrastructure are released separately, so
# api_location is deliberately empty and there is no build step.
#
# Required secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN_INTERNAL_FILES  deployment token (terraform output static_web_app_deployment_token)
#   SWA_CONFIG_JSON                           sign-in config (terraform output staticwebapp_config_json)
#   FILES_CONFIG_JSON                         file library settings, no secrets (terraform output files_config_json)

name: Deploy internal Azure Static Web App with storage

on:
  push:
    branches: [main]
    paths: ["content/privately-accessible-static-website-with-storage/**", ".github/workflows/deploy-internal-static-web-app-with-storage.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: swa-internal-files-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'internal-files-preview' || 'internal-files-production' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the site files are present
        run: |
          for f in content/privately-accessible-static-website-with-storage/index.html content/privately-accessible-static-website-with-storage/styles.css content/privately-accessible-static-website-with-storage/main.js content/privately-accessible-static-website-with-storage/healthz.html content/privately-accessible-static-website-with-storage/files.html content/privately-accessible-static-website-with-storage/files.js content/privately-accessible-static-website-with-storage/vendor/msal-browser.min.js; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done

      - name: Write APEX sign-in config
        env:
          SWA_CONFIG_JSON: ${{ secrets.SWA_CONFIG_JSON }}
        run: |
          test -n "$SWA_CONFIG_JSON" || { echo "::error::SWA_CONFIG_JSON secret is empty"; exit 1; }
          printf '%s' "$SWA_CONFIG_JSON" > content/privately-accessible-static-website-with-storage/staticwebapp.config.json
          python3 -m json.tool content/privately-accessible-static-website-with-storage/staticwebapp.config.json > /dev/null

      - name: Write file library config
        env:
          FILES_CONFIG_JSON: ${{ secrets.FILES_CONFIG_JSON }}
        run: |
          test -n "$FILES_CONFIG_JSON" || { echo "::error::FILES_CONFIG_JSON secret is empty"; exit 1; }
          printf '%s' "$FILES_CONFIG_JSON" > content/privately-accessible-static-website-with-storage/files-config.json
          python3 -m json.tool content/privately-accessible-static-website-with-storage/files-config.json > /dev/null

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_INTERNAL_FILES }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: content/privately-accessible-static-website-with-storage
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_preview:
    name: Remove preview environment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_INTERNAL_FILES }}
          action: close

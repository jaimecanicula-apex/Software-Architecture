# Delivery option B for the PUBLIC SIGN-IN site: Azure Repos + Azure Pipelines
#
# Deploys content/public-signin-static-website/ to the Static Web App behind Front Door (Entra ID
# sign-in, approved B2B guests only). The build writes the sign-in config from SWA_CONFIG_JSON.
#
# Build stage:   checks content/public-signin-static-website/, writes staticwebapp.config.json and publishes it as the "site" artifact.
# Preview stage: pull request validation builds (triggered by the main branch policy)
#                deploy the artifact to a named preview environment, pr<id>.
# Release stage: runs on main only, waits for the approval check on the
#                "swa-public-signin-production" environment, then deploys to production.
#
# The Function API, documents and infrastructure are released separately, so
# api_location is deliberately empty and there is no app build.
#
# One-time setup in Azure DevOps:
#   1. Variable group "swa-public-signin-deployment" with secret variables
#      AZURE_STATIC_WEB_APPS_API_TOKEN (terraform output static_web_app_deployment_token)
#      and SWA_CONFIG_JSON (terraform output staticwebapp_config_json).
#   2. Environment "swa-public-signin-production" with an Approvals check (and any other checks required).
#   3. Branch policy on main: required reviewers + build validation using this pipeline.
#
# Azure Repos has no "pull request closed" trigger. Remove old previews with:
#   az staticwebapp environment delete --name <static-web-app> --environment-name pr<id>

trigger:
  branches:
    include: [main]
  paths:
    include: [content/public-signin-static-website/*, infrastructure/public-signin-static-website/pipelines/azure-pipelines.yml]

# Ignored for Azure Repos; PR builds come from the branch policy on main.
pr: none

variables:
  - group: swa-public-signin-deployment

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Package
        displayName: Check and package content/public-signin-static-website/
        steps:
          - checkout: self

          - bash: |
              for f in content/public-signin-static-website/index.html content/public-signin-static-website/styles.css content/public-signin-static-website/main.js content/public-signin-static-website/healthz.html; do
                test -f "$f" || { echo "##vso[task.logissue type=error]Missing $f"; exit 1; }
              done
            displayName: Check the site files are present

          - bash: |
              test -n "$SWA_CONFIG_JSON" || { echo "##vso[task.logissue type=error]SWA_CONFIG_JSON is empty"; exit 1; }
              printf '%s' "$SWA_CONFIG_JSON" > content/public-signin-static-website/staticwebapp.config.json
              python3 -m json.tool content/public-signin-static-website/staticwebapp.config.json > /dev/null
            displayName: Write Entra sign-in config
            env:
              SWA_CONFIG_JSON: $(SWA_CONFIG_JSON)

          - publish: content/public-signin-static-website
            artifact: site
            displayName: Publish site artifact

  - stage: Preview
    displayName: Preview (pull request)
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: DeployPreview
        displayName: Deploy preview environment
        steps:
          - checkout: none

          - download: current
            artifact: site

          - task: AzureStaticWebApp@0
            displayName: Deploy to preview pr$(System.PullRequest.PullRequestId)
            inputs:
              workingDirectory: $(Pipeline.Workspace)/site
              app_location: /
              api_location: ""
              output_location: ""
              skip_app_build: true
              deployment_environment: pr$(System.PullRequest.PullRequestId)
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)

  - stage: Release
    displayName: Release (production)
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployProduction
        displayName: Deploy production
        environment: swa-public-signin-production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureStaticWebApp@0
                  displayName: Deploy to production
                  inputs:
                    workingDirectory: $(Pipeline.Workspace)/site
                    app_location: /
                    api_location: ""
                    output_location: ""
                    skip_app_build: true
                    azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
